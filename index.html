<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="매일 아침 살펴보는 국내외 사회·경제와 건축 소식">
<meta name="theme-color" content="#ffffff">
<title>DAILY BRIEF | 아침 뉴스 브리핑</title>
<link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css?v=4">
<style>
  :root { --paper: #fff; font-family: "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif; }
  .brand h1 { font-family: inherit; letter-spacing: -.065em; }
  .issue-card { background: #fff; }
  .issue-picture { margin: 0; }
  .issue-picture-photo { display: flex; flex-direction: column; aspect-ratio: auto; background: #fff; }
  .issue-news-photo { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: contain; }
  .issue-photo-credit { padding: .45rem .65rem; font-size: .78rem; color: var(--muted); }
  .issue-photo-credit a { display: inline; min-height: auto; font: inherit; }
</style>
<script src="app.js?v=5" defer></script>
</head>
<body>
<a class="skip" href="#content">본문 바로가기</a>
<header class="masthead">
  <div class="wrap top"><span>아침 뉴스 브리핑</span><span>매일 07:00 KST 갱신 예정</span></div>
  <div class="wrap brand">
    <h1>DAILY<br class="small-break"> BRIEF<span>.</span></h1>
    <p>국내외 사회·경제와 건축 소식</p>
  </div>
</header>
<main class="wrap" id="content">
  <div class="edition">
    <div><p class="kicker">아침판</p><h2 id="edition-title">뉴스 브리핑</h2><p class="muted" id="updated"></p></div>
    <div class="archive"><label for="archive">날짜별 아카이브</label><select id="archive" disabled><option>발행일 선택</option></select></div>
  </div>
  <div id="status" class="status" role="status" aria-live="polite">아침판을 불러오는 중입니다.</div>
  <details id="sources" hidden><summary>출처별 수집 상태</summary><ul id="source-list"></ul></details>
  <nav id="filters" aria-label="뉴스 카테고리" hidden></nav>
  <div id="articles" aria-live="polite" aria-busy="true"></div>
  <noscript>뉴스를 보려면 브라우저에서 JavaScript를 켜 주세요.</noscript>
</main>
<footer><div class="wrap"><strong>DAILY BRIEF</strong><span>한국시간 기준 · 각 기사와 공고의 원문은 출처에서 확인할 수 있습니다.</span></div></footer>
</body>
</html>
