name: DAILY BRIEF
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

concurrency:
  group: daily-brief
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Collect the daily brief
        shell: pwsh
        env:
          G2B_KEY: ${{ secrets.G2B_KEY }}
          LAW_OC: ${{ secrets.LAW_OC }}
        run: ./collect.ps1
      - name: Persist the archive
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update DAILY BRIEF archive'
          git pull --rebase
          git push
      - name: Assemble the site
        run: cp index.html style.css app.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
